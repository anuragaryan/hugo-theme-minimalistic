<footer>
  <div class="container-fluid">
    <div class="container">
      <div class="social-links">
        {{ if .Site.Params.Social.Email }}
          <a href="mailto:{{ .Site.Params.Social.Email }}" class="btn btn-lg btn-outline-secondary" target="_blank" rel="noopener noreferrer" aria-label="Email (opens in a new tab)"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
        {{ end }}

        {{ if .Site.Params.Social.Github }}
          <a href="https://github.com/{{ .Site.Params.Social.Github }}" class="btn btn-lg btn-outline-secondary" target="_blank" rel="noopener noreferrer" aria-label="GitHub (opens in a new tab)"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
        {{ end }}

        {{ if .Site.Params.Social.LinkedIn }}
          <a href="https://www.linkedin.com/in/{{ .Site.Params.Social.LinkedIn }}" class="btn btn-lg btn-outline-secondary" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn (opens in a new tab)"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
        {{ end }}

        {{ if .Site.Params.Social.Stackoverflow }}
          <a href="https://stackoverflow.com/{{ .Site.Params.Social.Stackoverflow }}" class="btn btn-lg btn-outline-secondary" target="_blank" rel="noopener noreferrer" aria-label="Stack Overflow (opens in a new tab)"><i class="fa-brands fa-stack-overflow" aria-hidden="true"></i></a>
        {{ end }}

        {{ if .Site.Params.Social.Twitter }}
          <a href="https://x.com/{{ .Site.Params.Social.Twitter }}" class="btn btn-lg btn-outline-secondary" target="_blank" rel="noopener noreferrer" aria-label="X, formerly Twitter (opens in a new tab)"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
        {{ end }}

        {{ if .Site.Params.Social.Instagram }}
        <a href="https://www.instagram.com/{{ .Site.Params.Social.Instagram }}" class="btn btn-lg btn-outline-secondary" target="_blank" rel="noopener noreferrer" aria-label="Instagram (opens in a new tab)"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
      {{ end }}
        </div>
    </div>
  </div>
</footer>
